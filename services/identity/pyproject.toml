[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-farm-identity"
version = "0.1.0"
description = "Tenant-aware Identity Service for Enterprise Farm SaaS"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../../shared"]
testpaths = ["tests"]
asyncio_mode = "auto"
