version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: farm_saas_db
    environment:
      POSTGRES_USER: saas_user
      POSTGRES_PASSWORD: saas_password
      POSTGRES_DB: enterprise_farm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_user -d enterprise_farm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
